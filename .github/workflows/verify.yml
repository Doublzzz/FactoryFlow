name: Verify contracts and source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ff_admin
          POSTGRES_PASSWORD: Synthetic-CI-Admin-Only-42
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ff_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: python -m pip install uv==0.12.21
      - run: uv sync --locked
      - run: npm ci
      - name: Install PostgreSQL 18 backup tools
        run: |
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          sudo install -D -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/pgdg.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          mkdir -p .tools/postgresql-18.6-4/pgsql
          ln -s /usr/lib/postgresql/18/bin .tools/postgresql-18.6-4/pgsql/bin
          .tools/postgresql-18.6-4/pgsql/bin/pg_dump --version
          .tools/postgresql-18.6-4/pgsql/bin/pg_restore --version
      - name: Prepare disposable PostgreSQL test configuration
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg import sql

          config = {
              "admin_url": "postgresql://ff_admin:Synthetic-CI-Admin-Only-42@127.0.0.1:5432/postgres",
              "runtime_password": "Synthetic-CI-Runtime-Only-42",
          }
          with psycopg.connect(config["admin_url"], autocommit=True) as conn:
              assert conn.info.server_version // 10000 == 18
              conn.execute(
                  sql.SQL("CREATE ROLE ff_runtime LOGIN PASSWORD {}").format(
                      sql.Literal(config["runtime_password"])
                  )
              )
          target = Path(os.environ["RUNNER_TEMP"]) / "factoryflow-test-admin.json"
          target.write_text(json.dumps(config), encoding="utf-8")
          target.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"FACTORYFLOW_TEST_ADMIN_CONFIG={target}\n")
          PY
      # Web-serving tests need the built assets. Native Windows tests retain their skip markers.
      - run: npm run build
      - run: uv run pytest -ra
      - run: uv run ruff check apps/api/src apps/api/tests scripts migrations tests
      - run: uv run ruff format --check apps/api/src apps/api/tests scripts migrations tests
      - run: node --test scripts/test-i18n.mjs
      - run: node scripts/check-i18n.mjs
      - run: uv run python scripts/check_architecture.py
      - run: uv run python scripts/export-openapi.py --check
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: git diff --check
