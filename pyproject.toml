[project]
name = "factoryflow-api"
version = "0.1.0"
description = "FactoryFlow contract-first modular backend"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.142.1",
  "openpyxl==3.1.5",
  "pillow==12.1.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pypdfium2==5.13.0",
  "sqlalchemy==2.1.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/factoryflow"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests/architecture"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".codex", ".tools", ".runtime", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
